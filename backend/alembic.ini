# Alembic config. Connection settings come from the DB_* environment variables
# (see migrations/env.py), not from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Revisions are numbered by hand: alembic revision --autogenerate --rev-id 0002 -m "..."
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Same look as the app's own log lines (src/logging_setup.py); the container runs in UTC.
[formatter_generic]
format = %(asctime)s %(levelname)-7s [%(name)s] %(message)s
datefmt = %Y-%m-%dT%H:%M:%SZ
