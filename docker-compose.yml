# Shared base for every environment: services, networks, volumes.
# Local development: `docker compose up` (docker-compose.override.yml is picked up automatically).
# Server: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: steam_stats
    env_file:
      - backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the volume is empty (first start).
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  steamspy_postgres:
    image: postgres:16-alpine
    container_name: steamspy_db
    env_file:
      - steamspy-service/.env
    volumes:
      - steamspy_postgres_data:/var/lib/postgresql/data
      - ./steamspy-service/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: backend
    env_file:
      - backend/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  steamspy_service:
    build: ./steamspy-service
    container_name: steamspy_service
    env_file:
      - steamspy-service/.env
    environment:
      - DB_HOST=steamspy_postgres
      - DB_PORT=5432
    depends_on:
      steamspy_postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend

  caddy:
    image: caddy:2.10-alpine
    container_name: steamstats_caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - steamspy_service
      - frontend

volumes:
  postgres_data:
  steamspy_postgres_data:
  frontend_node_modules:
  caddy_data:
  caddy_config:
