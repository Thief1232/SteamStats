# Local development only. `docker compose up` loads this file automatically on top of
# docker-compose.yml; Dokploy passes -f docker-compose.yml explicitly, so it never sees it.
# Code is bind-mounted and reloaded on change; ports are published on 127.0.0.1 only.
services:
  postgres:
    ports:
      - "127.0.0.1:5555:5432"

  steamspy_postgres:
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    volumes:
      - type: bind
        source: ./backend
        target: /app
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8080:8080"

  steamspy_service:
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8081", "--reload"]
    volumes:
      - type: bind
        source: ./steamspy-service
        target: /app
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8081:8081"

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - type: bind
        source: ./frontend
        target: /app
        bind:
          create_host_path: false
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"

  caddy:
    environment:
      FRONTEND_UPSTREAM: frontend:5173
    ports:
      - "8000:80"
