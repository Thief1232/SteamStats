services:
  postgres:
    image: postgres:16-alpine
    container_name: steam_stats
    restart: always
    env_file:
      - backend/.env
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  steamspy_postgres:
    image: postgres:16-alpine
    container_name: steamspy_db
    restart: always
    env_file:
      - steamspy-service/.env
    ports:
      - "5433:5432"
    volumes:
      - steamspy_postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file:
      - backend/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  steamspy_service:
    build: ./steamspy-service
    container_name: steamspy_service
    restart: always
    env_file:
      - steamspy-service/.env
    environment:
      - DB_HOST=steamspy_postgres
      - DB_PORT=5432
    volumes:
      - ./steamspy-service:/app
    depends_on:
      - steamspy_postgres
    ports:
      - "8081:8081"

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    env_file:
      - frontend/.env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    container_name: steamstats_nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      - backend
      - steamspy_service
      - frontend

volumes:
  postgres_data:
    driver: local
  steamspy_postgres_data:
    driver: local
  frontend_node_modules:
    driver: local
