worker_processes 1;
error_log /tmp/steamstats-nginx/error.log;
pid /tmp/steamstats-nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 4096;
    access_log /tmp/steamstats-nginx/access.log;

    client_body_temp_path /tmp/steamstats-nginx/client_body;
    proxy_temp_path /tmp/steamstats-nginx/proxy;
    fastcgi_temp_path /tmp/steamstats-nginx/fastcgi;
    uwsgi_temp_path /tmp/steamstats-nginx/uwsgi;
    scgi_temp_path /tmp/steamstats-nginx/scgi;

    server {
        listen 8000;
        server_name localhost;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /auth/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://[::1]:5173;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}